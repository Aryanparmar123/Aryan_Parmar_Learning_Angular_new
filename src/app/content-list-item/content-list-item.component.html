<mat-card *ngIf="product" class="mat-elevation-z6 product-card">
  <mat-card-header>
    <mat-card-title [appHoverHighlight]="'red'">Products List</mat-card-title>
    <mat-card-subtitle>Product ID: {{ product.id }}</mat-card-subtitle>
  </mat-card-header>

  <mat-divider></mat-divider>

  <mat-card-content class="product-content">
    <div class="product-details">
      <p><strong>Label:</strong> {{ product | productLabel }}</p>

      <p [appHoverHighlight]="'yellow'">
        <strong>Name:</strong> {{ product.name | uppercase }}
      </p>

      <p><strong>Price:</strong> {{ product.price | currency: 'CAD': 'symbol-narrow' }}</p>

      <p><strong>Category:</strong> {{ product.category | titlecase }}</p>

      <mat-chip
        color="primary"
        selected
        [appHoverHighlight]="'yellow'"
        style="margin-top: 10px;"
      >
        Color: {{ product.color ? 'Yes' : 'No' }}
      </mat-chip>
    </div>

    <div class="product-image">
      <img
        [src]="product.imageUrl"
        [alt]="product.name"
        class="styled-image"
      />
    </div>
  </mat-card-content>
</mat-card>
