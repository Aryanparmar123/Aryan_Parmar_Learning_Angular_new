<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>

  <div class="form-group">
    <label for="price">Price</label>
    <input type="number" id="price" formControlName="price" />
  </div>

  <div class="form-group">
    <label for="category">Category</label>
    <input type="text" id="category" formControlName="category" />
  </div>

  <div class="form-group">
    <label for="color">Color Available</label>
    <input type="checkbox" id="color" formControlName="color" />
  </div>

  <div class="form-group">
    <label for="imageUrl">Image URL</label>
    <input type="text" id="imageUrl" formControlName="imageUrl" />
  </div>

  <button type="submit">Submit</button>
  <button type="button" (click)="navigateToProductList()">Back to List</button>
</form>
